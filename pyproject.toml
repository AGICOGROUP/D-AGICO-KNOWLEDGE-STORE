[project]
name = "agico-knowledge-store"
version = "0.1.0"
description = "Enterprise knowledge and file backend for MCP agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "mcp>=2.2,<3",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1,<2",
  "pymupdf>=1.26,<2",
  "jieba>=0.42,<1",
  "fastembed>=0.8,<1",
  "rapidocr>=3,<4",
  "httpx>=0.28,<1",
  "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
probe = ["mcp>=1.20", "python-docx>=1.1,<2", "fastembed>=0.7,<1"]
load = ["locust>=2.42,<3", "psutil>=7,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agico_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
